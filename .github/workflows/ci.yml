name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Fetch the (large) default SoundFont once and share it to the build jobs.
  soundfont:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch FluidR3_GM SoundFont
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fluid-soundfont-gm
          mkdir sf
          cp /usr/share/sounds/sf2/FluidR3_GM.sf2 sf/
      - uses: actions/upload-artifact@v4
        with:
          name: fluidr3-soundfont
          path: sf/FluidR3_GM.sf2
          retention-days: 1

  linux:
    runs-on: ubuntu-latest
    needs: soundfont
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fluidr3-soundfont
          path: sf

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpt-dev libvorbis-dev libfluidsynth-dev \
            timgm6mb-soundfont libglfw3-dev libgl1-mesa-dev patchelf file \
            cmake ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DC2B_BUILD_GUI=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Build AppImage
        run: |
          cd build
          # Bundle the default SoundFont so MIDI works out of the box.
          mkdir -p AppDir/usr/share/sounds/sf2
          cp ../sf/FluidR3_GM.sf2 AppDir/usr/share/sounds/sf2/
          curl -sSL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSL -o linuxdeploy-plugin-appimage-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1 PATH="$PWD:$PATH" OUTPUT=circus2bmson-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e gui/circus2bmson-gui -e cli/circus2bmson \
            -d ../packaging/circus2bmson.desktop -i ../packaging/circus2bmson.png \
            --output appimage
          ls -la circus2bmson-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: circus2bmson-linux-x86_64
          path: build/circus2bmson-x86_64.AppImage

  windows:
    runs-on: windows-latest
    needs: soundfont
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: fluidr3-soundfont
          path: sf

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libopenmpt
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-fluidsynth
            mingw-w64-ucrt-x86_64-glfw

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DC2B_BUILD_GUI=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Bundle exe + runtime DLLs
        run: |
          mkdir -p dist
          cp build/cli/circus2bmson.exe dist/
          cp build/gui/circus2bmson-gui.exe dist/
          # Copy every MSYS2-provided DLL the CLI and GUI transitively need.
          for d in $(ldd build/cli/circus2bmson.exe build/gui/circus2bmson-gui.exe \
                       | grep -i ucrt64 | awk '{print $3}' | sort -u); do
            cp -u "$d" dist/
          done
          # Include the sample modules and the default SoundFont (for MIDI).
          cp tests/fixtures/*.mod dist/ || true
          cp sf/FluidR3_GM.sf2 dist/
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: circus2bmson-windows-x64
          path: dist/

